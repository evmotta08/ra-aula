<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>RA com marcador</title>
<script src="lib/aframe.min.js"></script>
<script src="lib/aframe-ar.js"></script>
<style>
  body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; }
  #dica {
    position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 10;
    background: rgba(8,12,24,.82); color: #fff; padding: 10px 16px; border-radius: 12px;
    font-size: .95rem; text-align: center; max-width: 90vw; pointer-events: none;
  }
</style>
</head>
<body>
<div id="dica">Permita a câmera e aponte para o marcador Hiro (impresso ou na tela).</div>

<a-scene embedded
  vr-mode-ui="enabled: false"
  renderer="alpha: true; antialias: true"
  arjs="sourceType: webcam; cameraParametersUrl: marcador/camera_para.dat; detectionMode: mono; debugUIEnabled: false;">

  <a-entity light="type: ambient; intensity: 1.1"></a-entity>
  <a-entity light="type: directional; intensity: 1.4" position="1 3 2"></a-entity>

  <a-marker type="pattern" url="marcador/patt.hiro" smooth="true" smoothCount="10">
    <a-entity gltf-model="models/astronauta.glb"
              scale="0.6 0.6 0.6" position="0 0 0" rotation="0 0 0"
              animation="property: rotation; to: 0 360 0; dur: 8000; easing: linear; loop: true">
    </a-entity>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
  const marcador = document.querySelector('a-marker');
  const dica = document.getElementById('dica');
  marcador.addEventListener('markerFound', () => { dica.style.display = 'none'; });
  marcador.addEventListener('markerLost', () => { dica.style.display = 'block'; });
</script>
</body>
</html>
